spring.application.name=user-service
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db?currentSchema=public
spring.datasource.username=user_service
spring.datasource.password=22
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-user.sql
spring.sql.init.data-locations=classpath:data-user.sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true