spring:
  application:
    name: config-service

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      instance:
        appname: config-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,encrypt,decrypt

encrypt:
  key: 12345