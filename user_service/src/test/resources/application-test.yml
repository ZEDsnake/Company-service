spring:
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

feign:
  client:
    config:
      company-service:
        url: http://localhost:8082
