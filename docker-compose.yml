services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: company_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qzwxecrv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  eureka-server:
    build:
      context: .
      dockerfile: eureka_service/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  config-service:
    build:
      context: .
      dockerfile: config_service/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - app-network

  company-service:
    build:
      context: .
      dockerfile: company_service/Dockerfile
    container_name: company-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 70s
    restart: on-failure
    networks:
      - app-network

  user-service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      config-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      company-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 70s
    restart: on-failure
    networks:
      - app-network

  gateway:
    build:
      context: .
      dockerfile: gateway_service/Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      company-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 70s
    restart: on-failure
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge