services:
  eureka-server:
    build: ./eureka_service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://eureka-server:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  config-server:
    build: ./config_service
    ports:
      - "8888:8888"
    volumes:
      - ./config_service/src/main/resources/configs:/configs
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://config-server:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  company-service:
    build: ./company_service
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  user-service:
    build: ./user_service
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  gateway:
    build: ./gateway_service
    ports:
      - "8080:8080"
    depends_on:
      company-service:
        condition: service_started
      user-service:
        condition: service_started
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
