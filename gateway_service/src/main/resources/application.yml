spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:http://config-service:8888"
  cloud:
    config:
      enabled: true
      fail-fast: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true